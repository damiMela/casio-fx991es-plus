name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fx991-calc-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests

  # Rolling pre-release: every push to main refreshes the "latest" release with a signed APK.
  # Releases created with GITHUB_TOKEN do not trigger other workflows, and the "latest" tag does
  # not match the v* pattern of release.yml, so this cannot loop or collide with tagged releases.
  rolling-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make scripts executable
        run: chmod +x gradlew .github/scripts/prepare-signing.sh
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/prepare-signing.sh
      - name: Build signed release APK
        env:
          VERSION_NAME: latest-${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/*.apk fx991-calc-latest.apk
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest fx991-calc-latest.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "Latest build (main)" \
            --notes "Automatic build of commit $GITHUB_SHA from main. Signed release APK, ready to sideload."
